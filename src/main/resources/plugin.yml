name: Job
version: 2.0.1
main: com.sagakenichi.job.JobPlugin
api-version: '1.21'
author: SagaK-dev
description: Job rewards, categorized item-selling GUI, and built-in yen currency for Spigot 1.21.1.
commands:
  job:
    description: Open the Job sell GUI or inspect/configure Job economy.
  jobmenu:
    aliases: [jmenu]
    description: Dedicated Job GUI command for servers where /job conflicts with another plugin.
permissions:
  job.use:
    description: Allows the Job GUI, balance, rates and status commands.
    default: true
  job.admin:
    description: Allows changing Job rates and reloading configuration.
    default: op
