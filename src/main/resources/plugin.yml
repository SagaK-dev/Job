name: Job
version: 1.2.0
main: com.sagakenichi.job.JobPlugin
api-version: '1.21'
author: SagaK-dev
description: Configurable work rewards with a 24-hour cumulative-playtime beginner multiplier for Spigot 1.21.1.
softdepend: [Vault]
commands:
  job:
    description: Show and configure job rates and beginner status.
    usage: /job <rates|status|rate|setrate|reload>
permissions:
  job.use:
    description: Allows use of /job rates and /job status.
    default: true
  job.admin:
    description: Allows changing rates and reloading Job configuration.
    default: op
