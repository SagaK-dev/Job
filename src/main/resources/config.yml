beginner:
  # Beginner bonus is based on cumulative play time, not time since first login.
  playtime-hours: 24
  multiplier: 3

# These rates are shared by automatic work rewards and the /job sell GUI.
# Example: miner-stone unit-count 16 / yen 1 means one completed work unit or
# one GUI sale unit pays 1 Job yen per 16 matching items/actions.
rates:
  miner-stone:
    unit-count: 16
    yen: 1
  miner-low-ore:
    unit-count: 1
    yen: 2
  miner-mid-ore:
    unit-count: 1
    yen: 4
  miner-high-ore:
    unit-count: 1
    yen: 12
  lumberjack:
    unit-count: 8
    yen: 1
  farmer:
    unit-count: 8
    yen: 1
  land-clearer:
    unit-count: 16
    yen: 1
  weeder:
    unit-count: 128
    yen: 1

anti-abuse:
  ignore-player-placed-blocks: true

messages:
  payout: true
  beginner-join: true
